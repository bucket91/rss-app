name: Build Release AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore
      - name: Write release keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          else
            echo "WARNING: No KEYSTORE_BASE64 secret set. Using debug keystore as placeholder for release build."
            echo "For Google Play publishing, set KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets."
            cp debug.keystore my-upload-key.jks
          fi
      - name: Build release AAB
        run: ./gradlew :app:bundleRelease
      - name: Sign release AAB (via apksigner if needed)
        if: env.STORE_PASSWORD != ''
        run: |
          java -jar "$ANDROID_HOME/build-tools/*/apksigner.jar" sign \
            --ks my-upload-key.jks \
            --ks-pass "env:STORE_PASSWORD" \
            --ks-key-alias upload \
            --key-pass "env:KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab 2>/dev/null || true
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Build debug APK (unsigned)
        run: ./gradlew :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
